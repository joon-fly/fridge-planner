<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 메뉴 플래너</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f0}
.login-box{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:360px;box-shadow:0 4px 24px rgba(0,0,0,0.08)}
.login-logo{font-size:32px;text-align:center;margin-bottom:8px}
.login-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:4px}
.login-sub{font-size:13px;color:#888;text-align:center;margin-bottom:28px}
.login-box input{width:100%;font-size:14px;padding:11px 14px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;outline:none}
.login-box input:focus{border-color:#1a1a1a}
.login-btn{width:100%;font-size:15px;padding:12px;border:none;border-radius:10px;background:#1a1a1a;color:#fff;cursor:pointer;font-weight:600;margin-top:4px}
.login-btn:hover{background:#333}
.login-error{font-size:12px;color:#c0392b;text-align:center;margin-top:10px;min-height:18px}
.app{display:none;grid-template-columns:300px 1fr;min-height:100vh}
.app.visible{display:grid}
.sidebar{background:#fafaf7;border-right:1px solid #e8e8e0;display:flex;flex-direction:column}
.sidebar-header{padding:14px 16px;border-bottom:1px solid #e8e8e0;display:flex;align-items:center;justify-content:space-between}
.sidebar-header h2{font-size:15px;font-weight:600}
.header-right{display:flex;align-items:center;gap:8px}
.badge{font-size:11px;padding:3px 9px;border-radius:12px;background:#e6f4ea;color:#2d7a3a}
.badge.saving{background:#fff8e1;color:#9a6f00}
.badge.error{background:#fdecea;color:#c0392b}
.logout-btn{font-size:11px;padding:3px 9px;border-radius:12px;background:#f0f0f0;color:#666;border:none;cursor:pointer}
.logout-btn:hover{background:#e0e0e0}
.summary-bar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:10px 12px;border-bottom:1px solid #e8e8e0}
.stat{background:#fff;border-radius:10px;padding:8px 10px;text-align:center;border:1px solid #ebebeb}
.stat-num{font-size:20px;font-weight:600;line-height:1}
.stat-label{font-size:10px;color:#888;margin-top:3px}
.green{color:#2d7a3a}.amber{color:#9a6f00}
.cat-tabs{display:flex;border-bottom:1px solid #e8e8e0}
.cat-tab{flex:1;font-size:11px;padding:8px 2px;border:none;background:transparent;cursor:pointer;color:#888;border-bottom:2px solid transparent}
.cat-tab.active{color:#1a1a1a;border-bottom:2px solid #1a1a1a;font-weight:600}
.ing-list{flex:1;overflow-y:auto;padding:8px}
.ing-item{background:#fff;border:1px solid #ebebeb;border-radius:10px;padding:9px 12px;margin-bottom:6px}
.ing-item:hover{border-color:#ddd}
.ing-top{display:flex;align-items:center;justify-content:space-between}
.ing-name{font-size:13px;font-weight:600}
.ing-meta{font-size:11px;color:#888;margin-top:3px;display:flex;gap:6px;align-items:center}
.storage-badge{font-size:10px;padding:1px 6px;border-radius:8px}
.fridge-badge{background:#e8f4fd;color:#1a6fa6}
.freezer-badge{background:#e8eafd;color:#3a3aa6}
.expiry-chip{font-size:10px;padding:2px 8px;border-radius:10px}
.ok{background:#e6f4ea;color:#2d7a3a}
.warn{background:#fff8e1;color:#9a6f00}
.danger{background:#fdecea;color:#c0392b}
.add-form{padding:10px;border-top:1px solid #e8e8e0;display:flex;flex-direction:column;gap:6px}
.add-form select,.add-form input{font-size:12px;padding:6px 9px;border:1px solid #ddd;border-radius:8px;background:#fff;width:100%}
.row{display:flex;gap:5px}
.add-btn{font-size:13px;padding:7px;cursor:pointer;background:#1a1a1a;color:#fff;border:none;border-radius:8px;width:100%}
.add-btn:hover{background:#333}
.del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:2px 4px;flex-shrink:0}
.del-btn:hover{color:#e74c3c}
.main{display:flex;flex-direction:column;background:#fff;overflow:hidden}
.main-header{padding:14px 20px;border-bottom:1px solid #ebebeb;display:flex;align-items:center;gap:10px;flex-shrink:0}
.main-header h1{font-size:16px;font-weight:600}
.user-info{font-size:11px;color:#aaa;margin-left:4px}
.main-tabs{display:flex;gap:4px;margin-left:auto}
.main-tab{font-size:12px;padding:5px 12px;border:1px solid #ddd;border-radius:20px;cursor:pointer;background:transparent;color:#666}
.main-tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.panel.active{display:flex}

/* 매장 설정 바 */
.store-bar{padding:8px 20px;border-bottom:1px solid #ebebeb;display:flex;align-items:center;gap:8px;flex-shrink:0;background:#fafaf7}
.store-bar-label{font-size:11px;color:#888}
.store-name-badge{font-size:12px;font-weight:600;color:#1a1a1a;background:#fff;border:1px solid #ddd;border-radius:8px;padding:3px 10px}
.store-change-btn{font-size:11px;padding:3px 9px;border:1px solid #ddd;border-radius:8px;background:transparent;cursor:pointer;color:#666;margin-left:auto}
.store-change-btn:hover{background:#f0f0f0}

/* 매장 선택 모달 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:420px;max-height:80vh;display:flex;flex-direction:column;gap:12px}
.modal h3{font-size:16px;font-weight:600}
.modal-search{display:flex;gap:8px}
.modal-search input{flex:1;font-size:13px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;outline:none}
.modal-search select{font-size:13px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff}
.modal-search-btn{font-size:13px;padding:8px 14px;border:none;border-radius:8px;background:#1a1a1a;color:#fff;cursor:pointer;white-space:nowrap}
.store-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;max-height:300px}
.store-item{background:#f5f5f0;border:1px solid #ebebeb;border-radius:10px;padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.store-item:hover{border-color:#aaa;background:#efefea}
.store-item-name{font-size:13px;font-weight:600}
.store-item-addr{font-size:11px;color:#888;margin-top:2px}
.modal-close{font-size:13px;padding:8px;border:1px solid #ddd;border-radius:8px;background:transparent;cursor:pointer;color:#666;text-align:center}
.modal-close:hover{background:#f0f0f0}
.modal-status{font-size:12px;color:#aaa;text-align:center;padding:8px}

/* 추천 패널 */
.alert-bar{padding:8px 20px;background:#fdecea;border-bottom:1px solid #f5c6cb;display:none;flex-shrink:0}
.alert-bar.show{display:block}
.alert-text{font-size:12px;color:#c0392b}
.menu-match-bar{padding:10px 20px;border-bottom:1px solid #ebebeb;flex-shrink:0}
.match-label{font-size:11px;color:#888;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 10px;border-radius:14px;border:1px solid #ebebeb;cursor:pointer;background:#f5f5f0;color:#555}
.chip.full{background:#e6f4ea;color:#2d7a3a;border-color:#c3e6cb}
.chip.partial{background:#fff8e1;color:#9a6f00;border-color:#ffeaa0}
.chip:hover{border-color:#aaa}
.chat{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:90%}
.msg.user{align-self:flex-end}
.msg-label{font-size:11px;color:#aaa;margin-bottom:4px}
.msg.user .msg-label{text-align:right}
.bubble{padding:10px 14px;font-size:14px;line-height:1.65;border-radius:18px}
.msg.user .bubble{background:#1a1a1a;color:#fff;border-radius:18px 18px 4px 18px}
.msg.ai .bubble{background:#f5f5f0;border:1px solid #ebebeb;border-radius:18px 18px 18px 4px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px;border-top:1px solid #ebebeb;flex-shrink:0}
.qbtn{font-size:12px;padding:5px 12px;border:1px solid #ddd;border-radius:14px;background:transparent;cursor:pointer;color:#555}
.qbtn:hover{background:#f5f5f0}
.input-row{display:flex;gap:8px;padding:12px 20px;border-top:1px solid #ebebeb;flex-shrink:0}
.input-row input{flex:1;font-size:14px;padding:9px 15px;border:1px solid #ddd;border-radius:22px;outline:none}
.input-row input:focus{border-color:#aaa}
.send-btn{font-size:13px;padding:9px 16px;border-radius:22px;border:none;background:#1a1a1a;color:#fff;cursor:pointer}
.send-btn:hover{background:#333}

/* 메뉴 관리 패널 */
.menu-panel-inner{flex:1;overflow-y:auto;padding:16px 20px}
.menu-section-title{font-size:13px;font-weight:600;color:#888;margin-bottom:10px;margin-top:16px}
.menu-section-title:first-child{margin-top:0}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:8px}
.menu-card{background:#f5f5f0;border:1px solid #ebebeb;border-radius:10px;padding:10px 12px;position:relative}
.menu-card.mine{background:#fff;border-color:#ddd}
.menu-card-name{font-size:13px;font-weight:600}
.menu-card-cat{font-size:10px;color:#888;margin-top:3px}
.menu-card-ingredients{font-size:10px;color:#aaa;margin-top:4px;line-height:1.5}
.menu-card-del{position:absolute;top:6px;right:6px;background:none;border:none;cursor:pointer;color:#ccc;font-size:12px}
.menu-card-del:hover{color:#e74c3c}
.add-menu-box{background:#fff;border:1px solid #ebebeb;border-radius:12px;padding:16px;margin-top:8px}
.add-menu-box h3{font-size:14px;font-weight:600;margin-bottom:12px}
.add-menu-search{display:flex;gap:8px;margin-bottom:12px}
.add-menu-search input{flex:1;font-size:13px;padding:8px 12px;border:1px solid #ddd;border-radius:8px;outline:none}
.suggest-btn{font-size:12px;padding:8px 14px;border:none;border-radius:8px;background:#f5f5f0;cursor:pointer;white-space:nowrap;color:#555}
.suggest-btn:hover{background:#ebebeb}
.suggest-btn.loading{opacity:0.6;cursor:default}
.suggest-result{background:#f9f9f7;border:1px solid #ebebeb;border-radius:10px;padding:14px;margin-bottom:12px;display:none}
.suggest-result.show{display:block}
.suggest-field{margin-bottom:8px}
.suggest-field label{font-size:11px;color:#888;display:block;margin-bottom:4px}
.suggest-field input,.suggest-field select{width:100%;font-size:13px;padding:6px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;outline:none}
.suggest-field .tag-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:#e8f4fd;color:#1a6fa6;display:flex;align-items:center;gap:4px}
.tag-del{cursor:pointer;color:#aaa;font-size:12px}
.tag-del:hover{color:#e74c3c}
.tag-input{font-size:12px;padding:3px 8px;border:1px solid #ddd;border-radius:8px;width:100px;outline:none}
.confirm-btn{width:100%;font-size:13px;padding:9px;border:none;border-radius:8px;background:#1a1a1a;color:#fff;cursor:pointer}
.confirm-btn:hover{background:#333}

.dots{display:inline-flex;gap:4px;align-items:center}
.dots span{width:6px;height:6px;border-radius:50%;background:#aaa;animation:p 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes p{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.empty{padding:20px;font-size:13px;color:#aaa;text-align:center;line-height:1.7}
@media(max-width:640px){
  .app.visible{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .sidebar{border-right:none;border-bottom:1px solid #e8e8e0}
  .ing-list{max-height:150px}
}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-logo">🧊</div>
    <div class="login-title">우리집 메뉴 플래너</div>
    <div class="login-sub">냉장고 재료로 오늘 뭐 먹을지 고민 끝!</div>
    <input id="loginEmail" type="email" placeholder="이메일" onkeydown="if(event.key==='Enter')login()" />
    <input id="loginPassword" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')login()" />
    <button class="login-btn" onclick="login()">로그인</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- 매장 선택 모달 -->
<div class="modal-overlay" id="storeModal">
  <div class="modal">
    <h3>🏪 롯데마트 매장 선택</h3>
    <div class="modal-search">
      <input id="storeSearchInput" placeholder="매장명 검색 (예: 잠실, 수원)" oninput="filterStores()" />
    </div>
    <div class="modal-status" id="storeModalStatus">지역을 선택하거나 매장명을 검색하세요</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px" id="regionTabs"></div>
    <div class="store-list" id="storeList"></div>
    <button class="modal-close" onclick="closeStoreModal()">닫기</button>
  </div>
</div>

<!-- 앱 -->
<div class="app" id="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>🧊 내 재고</h2>
      <div class="header-right">
        <span class="badge" id="badge">불러오는 중</span>
        <button class="logout-btn" onclick="logout()">로그아웃</button>
      </div>
    </div>
    <div class="summary-bar">
      <div class="stat"><div class="stat-num" id="totalCount">0</div><div class="stat-label">총 재료</div></div>
      <div class="stat"><div class="stat-num amber" id="warnCount">0</div><div class="stat-label">곧 소진필요</div></div>
      <div class="stat"><div class="stat-num green" id="menuCount">0</div><div class="stat-label">가능 메뉴</div></div>
    </div>
    <div class="cat-tabs">
      <button class="cat-tab active" onclick="setCat('all',this)">전체</button>
      <button class="cat-tab" onclick="setCat('meat',this)">🥩 육류</button>
      <button class="cat-tab" onclick="setCat('veg',this)">🥦 야채</button>
      <button class="cat-tab" onclick="setCat('etc',this)">🧀 기타</button>
    </div>
    <div class="ing-list" id="ingList"><div class="empty">불러오는 중...</div></div>
    <div class="add-form">
      <div class="row">
        <select id="iCat" style="flex:1">
          <option value="meat">🥩 육류/어류</option>
          <option value="veg">🥦 야채</option>
          <option value="etc">🧀 기타재료</option>
        </select>
        <select id="iStorage" style="flex:1">
          <option value="fridge">❄️ 냉장</option>
          <option value="freezer">🧊 냉동</option>
        </select>
      </div>
      <input id="iName" placeholder="재료명 (예: 돼지 앞다리살)" onkeydown="if(event.key==='Enter')addIng()" />
      <div class="row">
        <input id="iQty" placeholder="수량" style="flex:1" onkeydown="if(event.key==='Enter')addIng()" />
        <input id="iUnit" placeholder="단위(g,개,단…)" style="flex:1.5" onkeydown="if(event.key==='Enter')addIng()" />
      </div>
      <button class="add-btn" onclick="addIng()">+ 추가</button>
    </div>
  </div>

  <div class="main">
    <div class="main-header">
      <h1>🍳 메뉴 플래너</h1>
      <span class="user-info" id="userInfo"></span>
      <div class="main-tabs">
        <button class="main-tab active" onclick="setMainTab('recommend',this)">메뉴 추천</button>
        <button class="main-tab" onclick="setMainTab('manage',this)">메뉴 관리</button>
      </div>
    </div>

    <!-- 메뉴 추천 패널 -->
    <div class="panel active" id="panel-recommend">
      <div class="store-bar">
        <span class="store-bar-label">🏪 선호 매장</span>
        <span class="store-name-badge" id="storeNameBadge">미설정</span>
        <button class="store-change-btn" onclick="openStoreModal()">변경</button>
      </div>
      <div class="alert-bar" id="alertBar"><div class="alert-text" id="alertText"></div></div>
      <div class="menu-match-bar">
        <div class="match-label">재고로 만들 수 있는 메뉴 <span id="matchCount" style="font-weight:600;color:#1a1a1a">0개</span></div>
        <div class="chips" id="menuChips"><span style="font-size:11px;color:#aaa">재료를 추가하면 가능한 메뉴가 표시돼요</span></div>
      </div>
      <div class="chat" id="chat"></div>
      <div class="quick">
        <button class="qbtn" onclick="qs('재고로 오늘 뭐 먹을 수 있어?')">오늘 뭐 먹지?</button>
        <button class="qbtn" onclick="qs('이번주 7일 식단을 재료 낭비 없이 영양 균형 맞춰서 짜줘')">주간 식단</button>
        <button class="qbtn" onclick="qs('보관 기간 지난 재료부터 쓰는 메뉴 알려줘')">급한 재료 먼저</button>
        <button class="qbtn" onclick="fetchAndShop()">🛒 롯데마트 장보기</button>
      </div>
      <div class="input-row">
        <input id="msgInput" placeholder="메시지를 입력하세요..." onkeydown="if(event.key==='Enter')send()" />
        <button class="send-btn" onclick="send()">전송 →</button>
      </div>
    </div>

    <!-- 메뉴 관리 패널 -->
    <div class="panel" id="panel-manage">
      <div class="menu-panel-inner">
        <div class="menu-section-title">기본 메뉴</div>
        <div class="menu-grid" id="defaultMenuGrid"><div class="empty">불러오는 중...</div></div>
        <div class="menu-section-title">내가 추가한 메뉴</div>
        <div class="menu-grid" id="myMenuGrid"><div class="empty" style="grid-column:1/-1">아직 추가한 메뉴가 없어요</div></div>
        <div class="add-menu-box">
          <h3>➕ 새 메뉴 추가</h3>
          <div class="add-menu-search">
            <input id="newMenuName" placeholder="메뉴 이름 입력 (예: 우동)" onkeydown="if(event.key==='Enter')suggestMenu()" />
            <button class="suggest-btn" id="suggestBtn" onclick="suggestMenu()">AI 재료 추천</button>
          </div>
          <div class="suggest-result" id="suggestResult">
            <div class="suggest-field">
              <label>카테고리</label>
              <select id="newCat">
                <option value="한식">한식</option>
                <option value="일식">일식</option>
                <option value="양식">양식</option>
                <option value="중식">중식</option>
                <option value="기타">기타</option>
              </select>
            </div>
            <div class="suggest-field">
              <label>육류/어류 재료</label>
              <div class="tag-list" id="meatTags"></div>
              <input class="tag-input" id="meatInput" placeholder="+ 추가" onkeydown="if(event.key==='Enter')addTag('meat')" />
            </div>
            <div class="suggest-field">
              <label>야채/기타 재료</label>
              <div class="tag-list" id="vegTags"></div>
              <input class="tag-input" id="vegInput" placeholder="+ 추가" onkeydown="if(event.key==='Enter')addTag('veg')" />
            </div>
            <button class="confirm-btn" onclick="saveMenu()">메뉴 등록하기</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_DAYS = {
  fridge:{'돼지':3,'삼겹살':3,'목살':3,'앞다리':3,'뒷다리':3,'소':4,'양지':4,'사태':4,'우둔':4,'목심':4,'불고기':4,'닭':2,'닭다리':2,'닭볶음':2,'계란':21,'오징어':1,'고등어':1,'멸치':14,'햄':7,'소시지':7,'메추리알':14,'양파':14,'대파':7,'감자':14,'당근':14,'두부':3,'애호박':5,'버섯':5,'콩나물':3,'시금치':3,'미역':14,'무':10,'순두부':2,'양배추':7,'고구마':14},
  freezer:{'돼지':90,'삼겹살':90,'목살':90,'앞다리':90,'뒷다리':90,'소':90,'양지':90,'사태':90,'우둔':90,'목심':90,'불고기':90,'닭':90,'닭다리':90,'닭볶음':90,'계란':30,'오징어':60,'고등어':60,'멸치':60,'햄':30,'소시지':30,'메추리알':30,'두부':30,'시금치':30,'콩나물':30,'버섯':30}
};
function getMaxDays(name,st){const t=STORAGE_DAYS[st]||STORAGE_DAYS.fridge;for(const k of Object.keys(t)){if(name.includes(k))return t[k];}return st==='freezer'?60:7;}
function getDaysElapsed(ca){return Math.floor((new Date()-new Date(ca))/86400000);}
function getExpiryInfo(i){const e=getDaysElapsed(i.created_at),m=getMaxDays(i.name,i.storage_type||'fridge');return{elapsed:e,maxDays:m,remaining:m-e};}

let currentUser=null,currentToken=null,ings=[],menus=[],chatHistory=[],currentCat='all';
let userSettings=null; // 선호 매장

async function login(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const errEl=document.getElementById('loginError');
  errEl.textContent='';
  if(!email||!password){errEl.textContent='이메일과 비밀번호를 입력해주세요.';return;}
  try{
    const r=await fetch('/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email,password})});
    const data=await r.json();
    if(data.error){errEl.textContent=data.error;return;}
    currentUser=data.user;currentToken=data.access_token;
    sessionStorage.setItem('token',currentToken);sessionStorage.setItem('user',JSON.stringify(currentUser));
    showApp();
  }catch(e){errEl.textContent='로그인 중 오류가 발생했어요.';}
}
function logout(){
  sessionStorage.removeItem('token');sessionStorage.removeItem('user');
  currentUser=null;currentToken=null;ings=[];menus=[];chatHistory=[];userSettings=null;
  document.getElementById('app').className='app';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginEmail').value='';document.getElementById('loginPassword').value='';
}
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').className='app visible';
  document.getElementById('userInfo').textContent=currentUser.email;
  loadAll();
}
function restoreSession(){
  const token=sessionStorage.getItem('token'),user=sessionStorage.getItem('user');
  if(token&&user){currentToken=token;currentUser=JSON.parse(user);showApp();}
}

async function authFetch(path,method='GET',body=null){
  const opts={method,headers:{'Content-Type':'application/json','Authorization':`Bearer ${currentToken}`}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);return r.json();
}

async function loadAll(){
  await Promise.all([loadIngs(),loadMenus(),loadSettings()]);
  render();updateMenuMatch();updateAlerts();initChat();setBadge('saved');
}

async function loadIngs(){
  try{const r=await fetch(`/api/ingredients?user_id=${currentUser.id}`,{headers:{'Authorization':`Bearer ${currentToken}`,'Content-Type':'application/json'}});const d=await r.json();ings=Array.isArray(d)?d:[];}
  catch(e){ings=[];}
}
async function loadMenus(){
  try{const r=await fetch(`/api/menus?user_id=${currentUser.id}`,{headers:{'Authorization':`Bearer ${currentToken}`,'Content-Type':'application/json'}});const d=await r.json();menus=Array.isArray(d)?d:[];}
  catch(e){menus=[];}
  renderMenus();
}
async function loadSettings(){
  try{
    const r=await fetch(`/api/settings?user_id=${currentUser.id}`,{headers:{'Authorization':`Bearer ${currentToken}`}});
    userSettings=await r.json();
    updateStoreBadge();
  }catch(e){userSettings=null;}
}

function updateStoreBadge(){
  const badge=document.getElementById('storeNameBadge');
  badge.textContent=userSettings?.store_name||'미설정';
}

function setBadge(s){const b=document.getElementById('badge');b.className='badge'+(s==='saving'?' saving':s==='error'?' error':'');b.textContent=s==='saving'?'저장 중...':s==='error'?'오류':'저장됨 ✓';}

// 매장 모달
const LOTTE_STORES = {
  '서울':['강변점','건대입구점','광진점','구로점','금천점','노원점','도봉점','동대문점','마포점','목동점','문래점','미아점','방학점','서대문점','성수점','송파점','수서점','양평점','영등포점','은평점','잠실점','중계점','청량리점','천호점'],
  '경기':['가평점','고양점','광교점','광명점','구리점','군포점','김포점','남양주점','동수원점','분당점','산본점','성남점','수원점','시흥점','안산점','안양점','양주점','여주점','오산점','용인점','의왕점','의정부점','이천점','인덕원점','일산점','파주점','평택점','포천점','하남점','화성점'],
  '인천':['간석점','계양점','구월점','논현점','동인천점','부평점','서구점','송도점','연수점','작전점','주안점'],
  '부산':['광복점','동래점','동부산점','명장점','반여점','사상점','서부산점','수영점','연산점','온천점','장림점','해운대점'],
  '대구':['감삼점','검단점','관문점','대구점','동대구점','상인점','성서점','수성점','율하점','칠성점'],
  '대전':['관저점','노은점','둔산점','문화점','유성점','탄방점'],
  '광주':['광산점','금호점','상무점','수완점','첨단점'],
  '울산':['남울산점','동울산점','북울산점','울산점'],
  '경남':['거제점','경남대점','김해점','마산점','밀양점','진주점','창원점','통영점'],
  '경북':['경주점','구미점','김천점','안동점','포항점'],
  '전남':['광양점','목포점','순천점','여수점'],
  '전북':['군산점','익산점','전주점','정읍점'],
  '충남':['당진점','서산점','아산점','천안점','홍성점'],
  '충북':['청주점','충주점'],
  '강원':['강릉점','동해점','삼척점','속초점','원주점','춘천점'],
  '제주':['제주점','서귀포점'],
};
let currentRegion = '서울';

function openStoreModal(){
  document.getElementById('storeModal').className='modal-overlay show';
  renderRegionTabs();
  renderStoreList(currentRegion);
}
function closeStoreModal(){
  document.getElementById('storeModal').className='modal-overlay';
  document.getElementById('storeSearchInput').value='';
}

function renderRegionTabs(){
  const tabs = document.getElementById('regionTabs');
  tabs.innerHTML = Object.keys(LOTTE_STORES).map(r =>
    `<button onclick="selectRegion('${r}')" id="rtab-${r}" style="font-size:11px;padding:4px 10px;border:1px solid #ddd;border-radius:14px;background:${r===currentRegion?'#1a1a1a':'transparent'};color:${r===currentRegion?'#fff':'#666'};cursor:pointer">${r}</button>`
  ).join('');
}

function selectRegion(region){
  currentRegion = region;
  document.getElementById('storeSearchInput').value='';
  document.getElementById('storeModalStatus').textContent='';
  renderRegionTabs();
  renderStoreList(region);
}

function renderStoreList(region, keyword=''){
  const stores = keyword
    ? Object.entries(LOTTE_STORES).flatMap(([r,list])=>list.filter(s=>s.includes(keyword)).map(s=>({name:s,region:r})))
    : (LOTTE_STORES[region]||[]).map(s=>({name:s,region}));
  const el = document.getElementById('storeList');
  if(!stores.length){el.innerHTML='<div class="modal-status">검색 결과가 없어요</div>';return;}
  document.getElementById('storeModalStatus').textContent=`${stores.length}개 매장`;
  el.innerHTML = stores.map(s=>`
    <div class="store-item" onclick="selectStore('${e(s.name)}','${e(s.region)}')">
      <div><div class="store-item-name">롯데마트 ${e(s.name)}</div><div class="store-item-addr">${e(s.region)}</div></div>
      <span style="font-size:11px;color:#aaa">선택 →</span>
    </div>`).join('');
}

function filterStores(){
  const keyword = document.getElementById('storeSearchInput').value.trim();
  if(keyword) renderStoreList('', keyword);
  else renderStoreList(currentRegion);
}

async function selectStore(storeName, area){
  const fullName = storeName.startsWith('롯데마트') ? storeName : `롯데마트 ${storeName}`;
  try{
    await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${currentToken}`},body:JSON.stringify({user_id:currentUser.id,store_name:fullName,store_area:area})});
    userSettings={store_name:fullName,store_area:area};
    updateStoreBadge();
    closeStoreModal();
    addMsg('ai',`✅ 선호 매장이 **${fullName}**으로 설정됐어요! 이제 장보기 추천 시 이 매장 기준으로 안내해드릴게요.`);
  }catch(e){alert('저장 중 오류가 발생했어요.');}
}

function updateAlerts(){
  const expired=ings.filter(i=>getExpiryInfo(i).remaining<=0&&i.qty>0);
  const urgent=ings.filter(i=>{const r=getExpiryInfo(i).remaining;return i.qty>0&&r>0&&r<=2;});
  const bar=document.getElementById('alertBar'),txt=document.getElementById('alertText'),msgs=[];
  if(expired.length)msgs.push(`⚠️ 보관 기간 초과: ${expired.map(i=>i.name).join(', ')} — 빨리 드세요!`);
  if(urgent.length)msgs.push(`🔔 곧 소진 필요 (2일 이내): ${urgent.map(i=>i.name).join(', ')}`);
  bar.className=msgs.length?'alert-bar show':'alert-bar';txt.innerHTML=msgs.join('<br>');
}

function getMatched(){
  const meatNames=ings.filter(i=>i.cat==='meat'&&i.qty>0).map(i=>i.name);
  const vegNames=ings.filter(i=>(i.cat==='veg'||i.cat==='etc')&&i.qty>0).map(i=>i.name);
  return menus.map(m=>{
    const mMeat=m.meat||[],mVeg=m.veg||[];
    const hasMeat=mMeat.length===0||mMeat.some(mt=>meatNames.some(n=>n.includes(mt)||mt.includes(n)));
    const hasVeg=mVeg.length===0||mVeg.every(v=>vegNames.some(n=>n.includes(v)||v.includes(n)));
    const partMeat=mMeat.length===0||mMeat.some(mt=>meatNames.some(n=>n.includes(mt)||mt.includes(n)));
    const partVeg=mVeg.some(v=>vegNames.some(n=>n.includes(v)||v.includes(n)));
    if(hasMeat&&hasVeg)return{menu:m.name,level:'full'};
    if(partMeat&&(partVeg||mVeg.length===0))return{menu:m.name,level:'partial'};
    return null;
  }).filter(Boolean);
}

function updateMenuMatch(){
  const matched=getMatched(),full=matched.filter(m=>m.level==='full'),partial=matched.filter(m=>m.level==='partial');
  document.getElementById('menuCount').textContent=full.length;
  document.getElementById('matchCount').textContent=`${full.length}개 완성, ${partial.length}개 거의 가능`;
  const chips=document.getElementById('menuChips');
  if(!matched.length){chips.innerHTML='<span style="font-size:11px;color:#aaa">재료를 추가하면 가능한 메뉴가 표시돼요</span>';return;}
  chips.innerHTML=[...full,...partial].map(m=>`<span class="chip ${m.level}" onclick="qs('${m.menu} 만드는 법이랑 필요한 재료 알려줘')">${m.menu}${m.level==='full'?'':'*'}</span>`).join('');
}

function render(){
  const wc=ings.filter(i=>{const r=getExpiryInfo(i).remaining;return i.qty>0&&r<=2;}).length;
  document.getElementById('totalCount').textContent=ings.filter(i=>i.qty>0).length;
  document.getElementById('warnCount').textContent=wc;
  const el=document.getElementById('ingList');
  const filtered=currentCat==='all'?ings:ings.filter(i=>i.cat===currentCat);
  if(!filtered.length){el.innerHTML='<div class="empty">재료를 추가해보세요 👇</div>';return;}
  el.innerHTML=[...filtered].sort((a,b)=>getExpiryInfo(a).remaining-getExpiryInfo(b).remaining).map(i=>{
    const{elapsed,maxDays,remaining}=getExpiryInfo(i),st=i.storage_type||'fridge';
    let cls='ok',lbl='';
    if(remaining<=0){cls='danger';lbl=`${Math.abs(remaining)}일 초과!`;}
    else if(remaining<=2){cls='warn';lbl=`${remaining}일 남음 ⚠️`;}
    else{cls='ok';lbl=`${remaining}일 남음`;}
    const icon=i.cat==='meat'?'🥩':i.cat==='veg'?'🥦':'🧀';
    const sl=st==='freezer'?'🧊 냉동':'❄️ 냉장',sc=st==='freezer'?'freezer-badge':'fridge-badge';
    return `<div class="ing-item"><div class="ing-top"><div class="ing-name">${icon} ${e(i.name)}</div><button class="del-btn" onclick="delIng('${i.id}')">✕</button></div><div class="ing-meta"><span>${i.qty}${e(i.unit)}</span><span class="storage-badge ${sc}">${sl}</span><span class="expiry-chip ${cls}">${lbl}</span></div><div style="font-size:10px;color:#bbb;margin-top:3px">${elapsed}일째 보관 중 (적정 ${maxDays}일)</div></div>`;
  }).join('');
}

function renderMenus(){
  const defaultMenus=menus.filter(m=>!m.user_id);
  const myMenus=menus.filter(m=>m.user_id===currentUser.id);
  document.getElementById('defaultMenuGrid').innerHTML=defaultMenus.map(m=>`<div class="menu-card"><div class="menu-card-name">${e(m.name)}</div><div class="menu-card-cat">${e(m.category||'한식')}</div><div class="menu-card-ingredients">${[...(m.meat||[]),...(m.veg||[])].slice(0,3).join(', ')}${([...(m.meat||[]),...(m.veg||[])].length>3?'...':'')}</div></div>`).join('');
  document.getElementById('myMenuGrid').innerHTML=myMenus.length?myMenus.map(m=>`<div class="menu-card mine"><button class="menu-card-del" onclick="deleteMenu('${m.id}')">✕</button><div class="menu-card-name">${e(m.name)}</div><div class="menu-card-cat">${e(m.category||'기타')}</div><div class="menu-card-ingredients">${[...(m.meat||[]),...(m.veg||[])].slice(0,3).join(', ')}${([...(m.meat||[]),...(m.veg||[])].length>3?'...':'')}</div></div>`).join(''):'<div class="empty" style="grid-column:1/-1">아직 추가한 메뉴가 없어요</div>';
}

function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;');}
function setCat(cat,btn){currentCat=cat;document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');render();}
function setMainTab(tab,btn){
  document.querySelectorAll('.main-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById(`panel-${tab}`).classList.add('active');
}

async function addIng(){
  const name=document.getElementById('iName').value.trim();if(!name)return;
  const cat=document.getElementById('iCat').value,st=document.getElementById('iStorage').value;
  const qty=parseFloat(document.getElementById('iQty').value)||1;
  const unit=document.getElementById('iUnit').value.trim()||(cat==='meat'?'g':'개');
  setBadge('saving');
  await fetch('/api/ingredients',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${currentToken}`},body:JSON.stringify({name,cat,storage_type:st,qty,unit,user_id:currentUser.id})});
  ['iName','iQty','iUnit'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('iName').focus();
  await loadIngs();render();updateMenuMatch();updateAlerts();
}
async function delIng(id){
  ings=ings.filter(i=>i.id!==id);render();updateMenuMatch();updateAlerts();
  await fetch(`/api/ingredients?id=${id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${currentToken}`}});
}

function ctx(){
  if(!ings.length)return'현재 등록된 재료 없음';
  const meat=ings.filter(i=>i.cat==='meat'&&i.qty>0).map(i=>{const{remaining,elapsed,maxDays}=getExpiryInfo(i),s=i.storage_type==='freezer'?'냉동':'냉장';return`${i.name} ${i.qty}${i.unit}(${s}, ${elapsed}일째 보관, 적정${maxDays}일, ${remaining<=0?`${Math.abs(remaining)}일 초과`:`${remaining}일 남음`})`;}).join(', ')||'없음';
  const veg=ings.filter(i=>(i.cat==='veg'||i.cat==='etc')&&i.qty>0).map(i=>{const{remaining,elapsed,maxDays}=getExpiryInfo(i),s=i.storage_type==='freezer'?'냉동':'냉장';return`${i.name} ${i.qty}${i.unit}(${s}, ${elapsed}일째 보관, 적정${maxDays}일, ${remaining<=0?`${Math.abs(remaining)}일 초과`:`${remaining}일 남음`})`;}).join(', ')||'없음';
  const matched=getMatched();
  const full=matched.filter(m=>m.level==='full').map(m=>m.menu).join(', ')||'없음';
  const part=matched.filter(m=>m.level==='partial').map(m=>m.menu).join(', ')||'없음';
  const menuList=menus.map(m=>m.name).join(', ');
  return`[육류/어류] ${meat}\n[야채/기타] ${veg}\n[바로 만들 수 있는 메뉴] ${full}\n[재료 조금 더 있으면 가능한 메뉴] ${part}\n[전체 메뉴 레퍼토리] ${menuList}\n※ 조미료/김치는 항상 구비되어 있다고 가정합니다.`;
}

function initChat(){
  document.getElementById('chat').innerHTML='';
  const full=getMatched().filter(m=>m.level==='full');
  const expired=ings.filter(i=>getExpiryInfo(i).remaining<=0&&i.qty>0);
  let msg='안녕하세요! 우리집 메뉴 플래너예요 🍳\n\n';
  if(ings.length===0)msg+='아직 재료가 없어요. 왼쪽에서 육류/야채를 추가해보세요!';
  else{
    if(expired.length)msg+=`⚠️ ${expired.map(i=>i.name).join(', ')}이(가) 보관 기간을 초과했어요! 오늘 드시는 걸 추천해요.\n\n`;
    msg+=`현재 재료로 바로 만들 수 있는 메뉴가 ${full.length}개 있어요!\n`;
  }
  if(!userSettings?.store_name)msg+='\n🏪 상단에서 선호 롯데마트 매장을 설정하면 실시간 장보기 추천도 받을 수 있어요!';
  addMsg('ai',msg);
}

function addMsg(role,text){
  const area=document.getElementById('chat'),div=document.createElement('div');
  div.className=`msg ${role==='user'?'user':'ai'}`;
  div.innerHTML=`<div class="msg-label">${role==='user'?'나':'메뉴 플래너'}</div><div class="bubble">${text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}</div>`;
  area.appendChild(div);area.scrollTop=area.scrollHeight;
}
function addLoading(){const area=document.getElementById('chat'),div=document.createElement('div');div.className='msg ai';div.id='loading';div.innerHTML=`<div class="msg-label">메뉴 플래너</div><div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;area.appendChild(div);area.scrollTop=area.scrollHeight;}
function removeLoading(){const el=document.getElementById('loading');if(el)el.remove();}

function setMainTabChat(){document.querySelector('.main-tab').click();}

// 롯데마트 장보기 버튼
async function fetchAndShop(userText=null){
  if(!userSettings?.store_name){
    addMsg('ai','🏪 먼저 상단에서 선호 롯데마트 매장을 설정해주세요!');
    return;
  }
  const displayText = userText || `🛒 롯데마트 ${userSettings.store_name} 장보기 목록 확인해줘`;
  if(!userText) addMsg('user', displayText);
  addLoading();
  addMsg('ai',`📡 롯데마트 ${userSettings.store_name}에서 상품 검색 중이에요... (10초 정도 걸려요)`);

  // 검색할 재료: 사용자 메시지에서 재료명 추출 or 부족한 재료 자동 파악
  const neededItems = extractItemsFromText(userText) || getNeededItems();

  try{
    const searchItems = neededItems.slice(0,3);
    const productResults = [];
    for(const item of searchItems){
      try{
        const r=await fetch(`/api/lottemart?action=products&storeName=${encodeURIComponent(userSettings.store_name)}&keyword=${encodeURIComponent(item)}&area=${encodeURIComponent(userSettings.store_area||'서울')}`);
        const data=await r.json();
        const products=(data?.data?.products||[]).slice(0,3);
        productResults.push(...products);
      }catch(e){}
    }
    removeLoading();
    // userText가 있으면 채팅 메시지로, 없으면 기본 질문으로
    const msgToAI = userText || '현재 재고를 보고 이번주 균형잡힌 식사를 위해 추가로 사면 좋을 육류/야채를 롯데마트 실시간 상품 정보 기반으로 추천해줘';
    chatHistory.push({role:'user', content: msgToAI});
    await processMsg(null, {store_name:userSettings.store_name, store_area:userSettings.store_area, products:productResults});
  }catch(err){
    removeLoading();
    addMsg('ai','롯데마트 정보를 불러오는 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.');
  }
}

function extractItemsFromText(text){
  if(!text) return null;
  // 자주 쓰는 재료명 키워드 추출
  const keywords=['돼지','소고기','닭','계란','오징어','고등어','두부','양파','대파','감자','당근','시금치','콩나물','버섯','미역','애호박'];
  const found = keywords.filter(k=>text.includes(k));
  return found.length ? found : null;
}

function getNeededItems(){
  // 현재 재고에서 육류가 없거나 부족한 항목 파악
  const meatHave=ings.filter(i=>i.cat==='meat'&&i.qty>0).map(i=>i.name);
  // 메뉴에 필요한데 없는 재료 찾기
  const needed=new Set();
  menus.slice(0,5).forEach(m=>{
    (m.meat||[]).forEach(mt=>{if(!meatHave.some(h=>h.includes(mt)||mt.includes(h)))needed.add(mt);});
  });
  return [...needed].slice(0,3)||['돼지고기','소고기','닭고기'];
}

const SHOP_KEYWORDS=['장보기','장봐','마트','롯데마트','사야할','사야 할','구매','구입','살 것','살거','쇼핑','재고 확인','상품 찾'];

async function send(){
  const input=document.getElementById('msgInput');
  const text=input.value.trim();if(!text)return;
  input.value='';
  if(isShopRequest(text)) await fetchAndShop(text);
  else await processMsg(text);
}
async function qs(text){
  if(isShopRequest(text)) await fetchAndShop(text);
  else await processMsg(text);
}
function isShopRequest(text){
  if(!userSettings?.store_name) return false;
  return SHOP_KEYWORDS.some(k=>text.includes(k));
}

async function processMsg(text, storeProducts=null){
  if(text){addMsg('user',text);chatHistory.push({role:'user',content:text});}
  if(!storeProducts)addLoading();

  const storeInfo=storeProducts||null;

  try{
    const r=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${currentToken}`},
      body:JSON.stringify({messages:chatHistory,ingredients:ctx(),storeInfo:storeInfo?{...userSettings,...storeInfo}:userSettings})
    });
    const data=await r.json();
    let reply=data.reply||'응답을 받지 못했어요.';
    chatHistory.push({role:'assistant',content:reply});
    const updates=[...reply.matchAll(/\[UPDATE:(\{[^}]+\})\]/g)];
    if(updates.length){
      for(const m of updates){
        try{const u=JSON.parse(m[1]),ing=ings.find(i=>i.name===u.name);
        if(ing){ing.qty=Math.max(0,Math.round((ing.qty-(u.usedQty||0))*100)/100);await fetch(`/api/ingredients?id=${ing.id}`,{method:'PATCH',headers:{'Content-Type':'application/json','Authorization':`Bearer ${currentToken}`},body:JSON.stringify({qty:ing.qty})});}}catch(e2){}
      }
      reply=reply.replace(/\[UPDATE:\{[^}]+\}\]/g,'').trim();
      render();updateMenuMatch();updateAlerts();
    }
    removeLoading();addMsg('ai',reply);
  }catch(err){removeLoading();addMsg('ai','오류가 발생했어요. 잠시 후 다시 시도해주세요.');}
}

// 메뉴 관리
let suggestedMeat=[],suggestedVeg=[];
async function suggestMenu(){
  const name=document.getElementById('newMenuName').value.trim();if(!name)return;
  const btn=document.getElementById('suggestBtn');
  btn.textContent='추천 중...';btn.classList.add('loading');btn.disabled=true;
  try{
    const r=await fetch('/api/suggest',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${currentToken}`},body:JSON.stringify({menuName:name})});
    const data=await r.json();
    if(data.error){alert('AI 추천 중 오류가 발생했어요.');return;}
    suggestedMeat=[...(data.meat||[])];suggestedVeg=[...(data.veg||[])];
    if(data.category){const catEl=document.getElementById('newCat');for(const opt of catEl.options){if(opt.value===data.category){catEl.value=data.category;break;}}}
    renderTags();
    document.getElementById('suggestResult').className='suggest-result show';
  }catch(err){alert('오류가 발생했어요.');}
  finally{btn.textContent='AI 재료 추천';btn.classList.remove('loading');btn.disabled=false;}
}
function renderTags(){
  document.getElementById('meatTags').innerHTML=suggestedMeat.map((t,i)=>`<span class="tag">${e(t)}<span class="tag-del" onclick="removeTag('meat',${i})">✕</span></span>`).join('');
  document.getElementById('vegTags').innerHTML=suggestedVeg.map((t,i)=>`<span class="tag">${e(t)}<span class="tag-del" onclick="removeTag('veg',${i})">✕</span></span>`).join('');
}
function removeTag(type,idx){if(type==='meat')suggestedMeat.splice(idx,1);else suggestedVeg.splice(idx,1);renderTags();}
function addTag(type){
  const el=document.getElementById(type==='meat'?'meatInput':'vegInput');
  const val=el.value.trim();if(!val)return;
  if(type==='meat')suggestedMeat.push(val);else suggestedVeg.push(val);
  el.value='';renderTags();
}
async function saveMenu(){
  const name=document.getElementById('newMenuName').value.trim();if(!name){alert('메뉴 이름을 입력해주세요.');return;}
  const category=document.getElementById('newCat').value;
  await fetch('/api/menus',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${currentToken}`},body:JSON.stringify({name,category,meat:suggestedMeat,veg:suggestedVeg,user_id:currentUser.id})});
  document.getElementById('newMenuName').value='';
  document.getElementById('suggestResult').className='suggest-result';
  suggestedMeat=[];suggestedVeg=[];
  await loadMenus();updateMenuMatch();
}
async function deleteMenu(id){
  if(!confirm('이 메뉴를 삭제할까요?'))return;
  await fetch(`/api/menus?id=${id}&user_id=${currentUser.id}`,{method:'DELETE',headers:{'Authorization':`Bearer ${currentToken}`}});
  await loadMenus();updateMenuMatch();
}

restoreSession();
</script>
